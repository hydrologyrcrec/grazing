<main class="grid min-h-screen place-items-center bg-gray-100 px-4 py-10 text-gray-950">
  <section class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
    <header class="mb-7 text-center">
      <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
      <p class="mt-2 text-sm text-gray-500">Sign in to access your account</p>
    </header>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <app-form-field
        controlId="login-email"
        label="Email"
        [required]="true"
        [error]="
          form.controls.email.touched && form.controls.email.invalid
            ? 'Enter a valid email address.'
            : ''
        "
      >
        <input
          id="login-email"
          type="email"
          autocomplete="email"
          formControlName="email"
          class="form-control"
          maxlength="255"
          required
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          [attr.aria-describedby]="
            form.controls.email.touched && form.controls.email.invalid ? 'login-email-error' : null
          "
        />
      </app-form-field>
      <app-form-field
        controlId="login-password"
        label="Password"
        [required]="true"
        [error]="
          form.controls.password.touched && form.controls.password.invalid
            ? 'Enter your password.'
            : ''
        "
      >
        <input
          id="login-password"
          type="password"
          autocomplete="current-password"
          formControlName="password"
          class="form-control"
          maxlength="128"
          required
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          [attr.aria-describedby]="
            form.controls.password.touched && form.controls.password.invalid
              ? 'login-password-error'
              : null
          "
        />
      </app-form-field>
      @if (error()) {
        <app-error-alert [message]="error()" />
      }
      <button
        type="submit"
        [disabled]="submitting()"
        [attr.aria-busy]="submitting()"
        class="w-full rounded-lg bg-gray-950 px-4 py-2.5 text-sm font-semibold text-white hover:bg-gray-800 disabled:opacity-50"
      >
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-500">
      Need an account?
      <a routerLink="/signup" class="font-semibold text-gray-950 hover:underline">Sign up</a>
    </p>
  </section>
</main>
