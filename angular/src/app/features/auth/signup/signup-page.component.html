<main class="grid min-h-screen place-items-center bg-gray-100 px-4 py-10 text-gray-950">
  <section class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
    <header class="mb-7 text-center">
      <h1 class="text-2xl font-semibold tracking-tight">Create account</h1>
      <p class="mt-2 text-sm text-gray-500">Enter your information to get started</p>
    </header>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <app-form-field controlId="signup-first-name" label="First name"
          ><input
            id="signup-first-name"
            autocomplete="given-name"
            formControlName="firstName"
            maxlength="100"
            class="form-control"
        /></app-form-field>
        <app-form-field controlId="signup-last-name" label="Last name"
          ><input
            id="signup-last-name"
            autocomplete="family-name"
            formControlName="lastName"
            maxlength="100"
            class="form-control"
        /></app-form-field>
      </div>
      <app-form-field
        controlId="signup-email"
        label="Email"
        [required]="true"
        [error]="
          form.controls.email.touched && form.controls.email.invalid
            ? 'Enter a valid email address.'
            : ''
        "
      >
        <input
          id="signup-email"
          type="email"
          autocomplete="email"
          formControlName="email"
          maxlength="255"
          class="form-control"
          required
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          [attr.aria-describedby]="
            form.controls.email.touched && form.controls.email.invalid ? 'signup-email-error' : null
          "
        />
      </app-form-field>
      <app-form-field
        controlId="signup-password"
        label="Password"
        [required]="true"
        hint="Must contain at least 12 characters."
        [error]="
          form.controls.password.touched && form.controls.password.invalid
            ? 'Use 12 to 128 characters.'
            : ''
        "
      >
        <input
          id="signup-password"
          type="password"
          autocomplete="new-password"
          formControlName="password"
          minlength="12"
          maxlength="128"
          class="form-control"
          required
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          [attr.aria-describedby]="
            form.controls.password.touched && form.controls.password.invalid
              ? 'signup-password-error'
              : 'signup-password-hint'
          "
        />
      </app-form-field>
      @if (error()) {
        <app-error-alert [message]="error()" />
      }
      <button
        type="submit"
        [disabled]="submitting()"
        [attr.aria-busy]="submitting()"
        class="w-full rounded-lg bg-gray-950 px-4 py-2.5 text-sm font-semibold text-white hover:bg-gray-800 disabled:opacity-50"
      >
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>
    <p class="mt-6 text-center text-sm text-gray-500">
      Already have an account?
      <a routerLink="/login" class="font-semibold text-gray-950 hover:underline">Sign in</a>
    </p>
  </section>
</main>
