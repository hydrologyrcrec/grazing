[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "grazing-api"
version = "1.0.0"
description = "Pasture 360 authentication, pasture management, and geocoding API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.136,<1", "uvicorn[standard]>=0.44,<1",
  "sqlalchemy>=2.0.49,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.18,<2", "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3", "argon2-cffi>=25.1,<26",
  "PyJWT>=2.10,<3", "httpx[socks]>=0.28,<1", "shapely>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.18,<2", "types-shapely>=2.1,<3", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
